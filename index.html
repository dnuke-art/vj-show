<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>vj-show player</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; cursor:none; }
  canvas { display:block; width:100vw; height:100vh; }
  #stats { position:fixed; top:8px; left:8px; color:#0f0; font:12px/1.4 monospace;
           background:rgba(0,0,0,.6); padding:6px 8px; white-space:pre; display:none; }
  #err { position:fixed; bottom:8px; left:8px; color:#f66; font:12px monospace;
         background:rgba(0,0,0,.7); padding:6px 8px; white-space:pre-wrap; max-width:90vw; display:none; }
  /* control mode: preview strip on top, sliders below */
  body.control { cursor:auto; overflow:auto; background:#111; color:#ddd; font:14px/1.4 system-ui, sans-serif; }
  body.control canvas { display:block; margin:0 auto; }
  #monlabels { display:none; margin:4px auto 0; font:11px monospace; color:#888; justify-content:space-between; }
  #monlabels span { display:block; text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  body.control #monlabels { display:flex; }
  #panel { display:none; padding:12px 16px 40px; max-width:720px; margin:0 auto; }
  body.control #panel { display:block; }
  #panel .row { display:grid; grid-template-columns: 9em 1fr 5em; gap:10px; align-items:center; margin:6px 0; }
  #panel .row label { font-family:monospace; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #panel input[type=range] { width:100%; }
  #panel .val { font-family:monospace; font-size:13px; text-align:right; }
  #panel .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 14px; }
  #panel select, #panel button { font:14px system-ui, sans-serif; padding:6px 10px; background:#222; color:#ddd; border:1px solid #444; border-radius:4px;
                                 transition: background .12s, border-color .12s, transform .06s; }
  #panel button:hover { background:#2c2c2c; border-color:#666; }
  #panel button:active, #panel button.flash { background:#3a7bd5; border-color:#5b9cf0; color:#fff; transform:scale(.97); }
  #panel button.done { background:#2e7d4f; border-color:#3fa76a; color:#fff; }
  #panel button:disabled { opacity:.4; cursor:default; }
  #panel .status { font-family:monospace; font-size:12px; color:#8c8; white-space:pre-wrap; }
  #panel h3 { margin:14px 0 4px; font-size:13px; color:#999; text-transform:uppercase; letter-spacing:.05em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="monlabels"><span>PVW · preview (what the panel edits)</span><span>PGM · program (what the displays show)</span></div>
<div id="stats"></div>
<div id="err"></div>
<script src="vendor/peerjs.min.js"></script>
<div id="panel">
  <div class="status" id="pstatus">connecting…</div>
  <div class="bar">
    <select id="pscene"></select>
    <label><input type="checkbox" id="plock"> lock scene</label>
    <button id="pplay">play now</button>
    <button id="pnext">next scene</button>
    <button id="preset">reset overrides</button>
    <button id="psave">save to scenes.json</button>
  </div>
  <div id="psliders"></div>
</div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// vj-show player.
// Loads scenes.json, compiles each scene's fragment shader, autopilots through
// the list with timed crossfades, hot-reloads the list on change.
//
// Multi-instance: ?sync=<room>&id=<name>&grid=<cols>,<rows>&tile=<col>,<row>
// Instances in the same room meet through a PeerServer (the local one in server.js,
// or the public 0.peerjs.com for a static copy) and open WebRTC data channels. The
// first display to claim the room's peer id is leader: it owns the schedule and the
// show clock. Followers NTP-style ping the leader and slew their clock onto it. Every
// scene is a pure function of show time, so synced clocks + shared schedule = synced
// frames, and each instance renders only its own tile of the full virtual canvas.
// ---------------------------------------------------------------------------

const PRELUDE = `#version 300 es
precision highp float;
uniform float u_time;            // show time, seconds, shared across instances
uniform vec2  u_resolution;      // this instance's render target size
uniform vec2  u_fullResolution;  // virtual canvas size across all tiles
uniform vec2  u_tileOrigin;      // this tile's offset inside the virtual canvas
uniform float u_seed;
out vec4 fragColor;
// centred, aspect-correct coordinate on the FULL virtual canvas
vec2 vuv(){ return (gl_FragCoord.xy + u_tileOrigin - 0.5*u_fullResolution) / u_fullResolution.y; }
`;

const VERT = `#version 300 es
in vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

const COMPOSITE = `#version 300 es
precision highp float;
uniform sampler2D texA;
uniform sampler2D texB;
uniform float mixAmt;
uniform vec2 u_resolution, u_offset;
out vec4 fragColor;
void main(){
  vec2 uv = (gl_FragCoord.xy - u_offset) / u_resolution;
  fragColor = mix(texture(texA, uv), texture(texB, uv), mixAmt);
}`;

const qs = new URLSearchParams(location.search);
const MODE = qs.get('mode') === 'control' ? 'control' : 'display';
const isControl = MODE === 'control';
if (isControl) document.body.classList.add('control');
const canvas = document.getElementById('c');
const statsEl = document.getElementById('stats');
const errEl = document.getElementById('err');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, powerPreference:'high-performance', preserveDrawingBuffer:false });
if (!gl) { showErr('WebGL2 not available'); throw new Error('no webgl2'); }

// ---- watchdog -------------------------------------------------------------
function scheduleReload(why, delayMs){
  console.warn('[watchdog] reload in', delayMs, 'ms:', why);
  let n = 0;
  try { n = +(sessionStorage.getItem('reloads') || 0) + 1; sessionStorage.setItem('reloads', n); } catch(e){}
  const delay = n > 5 ? 60000 : delayMs;   // back off if we are reload-looping
  setTimeout(() => location.reload(), delay);
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); scheduleReload('context lost', 1000); });
window.addEventListener('error', e => { showErr(String(e.message)); scheduleReload('js error: ' + e.message, 5000); });
window.addEventListener('unhandledrejection', e => { showErr(String(e.reason)); });
setTimeout(() => { try { sessionStorage.setItem('reloads', 0); } catch(e){} }, 5*60*1000);

function showErr(msg){ errEl.style.display = 'block'; errEl.textContent = msg; console.error(msg); }
function clearErr(){ errEl.style.display = 'none'; }

// ---- gl helpers -----------------------------------------------------------
function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s); gl.deleteShader(s);
    throw new Error(log);
  }
  return s;
}
const vertShader = compile(gl.VERTEX_SHADER, VERT);
function link(fragSrc){
  const p = gl.createProgram();
  const f = compile(gl.FRAGMENT_SHADER, fragSrc);
  gl.attachShader(p, vertShader); gl.attachShader(p, f); gl.linkProgram(p);
  gl.deleteShader(f);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(p); gl.deleteProgram(p);
    throw new Error(log);
  }
  return p;
}
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function makeTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fbo, w, h };
}
function freeTarget(t){ if (!t) return; gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }

const compositeProg = link(COMPOSITE);
const compU = {
  texA: gl.getUniformLocation(compositeProg, 'texA'),
  texB: gl.getUniformLocation(compositeProg, 'texB'),
  mixAmt: gl.getUniformLocation(compositeProg, 'mixAmt'),
  res: gl.getUniformLocation(compositeProg, 'u_resolution'),
  off: gl.getUniformLocation(compositeProg, 'u_offset'),
};

// ---- clock ----------------------------------------------------------------
// show clock = local monotonic clock + clockOffset. Leader's offset is whatever
// it happens to be (0 unless it was once a follower); followers slew onto it.
function now(){ return performance.now() / 1000; }
let clockOffset = 0;
function showNow(){ return now() + clockOffset; }
let epoch = showNow();           // u_time = showNow() - epoch

// ---- canvas, tile, fit ----------------------------------------------------
// The show has a resolution-free canvas aspect (scenes.json "canvas": "16:9"). Each window
// shows one tile of it: ?grid=cols,rows&tile=col,row, or ?tile=x,y,w,h in 0..1 canvas
// units (y down, row 0 at the top). The window's pixels map onto its tile according to
// "fit" (scenes.json, or ?fit= per window): contain = letterbox, cover = zoom and trim,
// fill = stretch. No pixel sizes anywhere: canvas units are x in [0, A], y in [0, 1].
const grid = (qs.get('grid') || '1,1').split(',').map(Number);
const tileQ = (qs.get('tile') || '0,0').split(',').map(Number);
const COLS = Math.max(1, grid[0] | 0), ROWS = Math.max(1, grid[1] | 0);
let TILE;
if (tileQ.length === 4) TILE = { x: tileQ[0], y: tileQ[1], w: tileQ[2], h: tileQ[3] };
else { const c = Math.min(COLS - 1, tileQ[0] | 0), r = Math.min(ROWS - 1, tileQ[1] | 0);
       TILE = { x: c / COLS, y: r / ROWS, w: 1 / COLS, h: 1 / ROWS }; }
if (isControl) TILE = { x: 0, y: 0, w: 1, h: 1 };                     // the preview shows the whole canvas
const FIT_Q = qs.get('fit');
function canvasAspect(){
  const c = String(config.canvas || '16:9'), m = c.split(/[:x\/]/).map(Number);
  return m.length >= 2 && m[1] ? m[0] / m[1] : (+c || 16 / 9);
}
function fitMode(){ const f = FIT_Q || config.fit || 'contain'; return ['contain', 'cover', 'fill'].includes(f) ? f : 'contain'; }
const MON_GAP = 8;                           // px between PGM and PVW monitors in control mode
let view = { x: 0, y: 0, w: 1, h: 1 };       // window-pixel rect that shows the tile
let region = { X: 0, Y: 0, W: 1, H: 1 };     // canvas-unit rect shown inside `view`
// Uniform values for a render target of this window: virtual canvas size in target pixels
// and where this window's region sits in it. Identical results at any resolution.
function tileUniforms(target){
  const Fx = target.w / region.W, Fy = target.h / region.H;
  return { fullW: canvasAspect() * Fx, fullH: Fy, tileX: region.X * Fx, tileY: (1 - region.Y - region.H) * Fy };
}

// ---- state ----------------------------------------------------------------
let config = { crossfade: 3, renderScale: 1, reloadInterval: 5, scenes: [] };
let configText = '';
const programs = new Map();   // shaderPath -> { src, prog, uniform locations }
let scenes = [];              // resolved: { name, shader, duration, params, seed }
let overrides = {};           // sceneName -> { param: value }, live tweaks layered over scenes.json
function effParams(scene){ const o = overrides[scene.name]; return o ? Object.assign({}, scene.params, o) : scene.params; }
let cur = -1, nxt = -1;
let sceneStart = 0, fadeStart = -1;   // in show-clock seconds
let targetA = null, targetB = null;
let renderW = 0, renderH = 0;

function disposeEntry(p){
  if (p.kind === 'module') { try { p.inst.dispose && p.inst.dispose(); } catch(e){ console.warn(e); } }
  else gl.deleteProgram(p.prog);
}
function drawQuad(){ gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLES, 0, 3); }
// Perspective projection for this tile's sub-frustum of the full virtual canvas.
function tileProjection(fovYDeg, near, far, fullW, fullH, ox, oy, w, h){
  const top = near * Math.tan(fovYDeg * Math.PI / 360), right = top * fullW / fullH;
  const l = -right + 2 * right * (ox / fullW), r = -right + 2 * right * ((ox + w) / fullW);
  const b = -top + 2 * top * (oy / fullH), t = -top + 2 * top * ((oy + h) / fullH);
  const m = new Float32Array(16);
  m[0] = 2*near/(r-l); m[5] = 2*near/(t-b); m[8] = (r+l)/(r-l); m[9] = (t+b)/(t-b);
  m[10] = -(far+near)/(far-near); m[11] = -1; m[14] = -2*far*near/(far-near);
  return m;
}
// What a module scene gets: `export default function(gl, api){ return { draw(ctx), dispose() } }`
const sceneApi = { compileProgram: (vs, fs) => {
    const p = gl.createProgram(); const v = compile(gl.VERTEX_SHADER, vs); const f = compile(gl.FRAGMENT_SHADER, fs);
    gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p); gl.deleteShader(v); gl.deleteShader(f);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { const log = gl.getProgramInfoLog(p); gl.deleteProgram(p); throw new Error(log); }
    return p;
  }, makeTarget, freeTarget, drawQuad, tileProjection, VERT };

async function fetchText(url){
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache:'no-store' });
  if (!r.ok) throw new Error(url + ': ' + r.status);
  return r.text();
}

async function loadConfig(){
  const text = await fetchText('scenes.json');
  if (text === configText) return false;
  const cfg = JSON.parse(text);
  const list = [];
  for (const s of cfg.scenes || []) {
    const key = s.module || s.shader;
    const src = await fetchText(key);
    const have = programs.get(key);
    if (s.module) {
      if (!have || have.src !== src) {
        const mod = await import(new URL(key, location.href).href + '?v=' + hashStr(src) + '-' + src.length);
        const inst = mod.default(gl, sceneApi);
        if (have) disposeEntry(have);
        programs.set(key, { src, kind:'module', inst, name: key });
      }
    } else if (!have || have.src !== src) {
      const prog = link(PRELUDE + src);
      if (have) disposeEntry(have);
      programs.set(key, {
        src, kind:'shader', prog,
        u_time: gl.getUniformLocation(prog, 'u_time'),
        u_resolution: gl.getUniformLocation(prog, 'u_resolution'),
        u_fullResolution: gl.getUniformLocation(prog, 'u_fullResolution'),
        u_tileOrigin: gl.getUniformLocation(prog, 'u_tileOrigin'),
        u_seed: gl.getUniformLocation(prog, 'u_seed'),
        params: new Map(),
      });
    }
    list.push({
      name: s.name || key,
      shader: key,
      duration: +s.duration || 30,
      params: s.params || {},
      seed: hashStr(s.name || s.shader) * 100,
    });
  }
  for (const [path, p] of programs) {
    if (!list.some(s => s.shader === path)) { disposeEntry(p); programs.delete(path); }
  }
  const prevName = cur >= 0 && scenes[cur] ? scenes[cur].name : null;
  const nextName = nxt >= 0 && scenes[nxt] ? scenes[nxt].name : null;
  configText = text;
  config = { crossfade: +cfg.crossfade || 3, renderScale: +cfg.renderScale || 1,
             reloadInterval: +cfg.reloadInterval || 5, scenes: cfg.scenes, sync: cfg.sync || {},
             canvas: cfg.canvas || '16:9', fit: cfg.fit };
  scenes = list;
  if (!scenes.length) throw new Error('scenes.json has no scenes');
  const keep = prevName !== null ? scenes.findIndex(s => s.name === prevName) : -1;
  if (keep >= 0) cur = keep;
  else { cur = 0; nxt = -1; fadeStart = -1; sceneStart = showNow(); }
  nxt = nextName !== null ? scenes.findIndex(s => s.name === nextName) : -1;
  if (nxt < 0) fadeStart = -1;
  resize(true);
  clearErr();
  console.log('[config] loaded', scenes.length, 'scenes, renderScale', config.renderScale);
  panelRebuild();
  return true;
}

function hashStr(s){ let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; }

// ---- sizing ---------------------------------------------------------------
function resize(force){
  const A = canvasAspect(), fit = fitMode();
  let w = Math.floor(window.innerWidth), h = Math.floor(window.innerHeight), mon = 0;
  if (isControl) {                                     // two monitors (PGM | PVW) at the show's aspect, ≤ 30% of height
    mon = Math.floor(Math.min((window.innerWidth - MON_GAP) / 2, window.innerHeight * 0.3 * A));
    w = mon * 2 + MON_GAP; h = Math.max(1, Math.floor(mon / A));
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    const lab = document.getElementById('monlabels'); lab.style.width = w + 'px';
    for (const sp of lab.children) sp.style.width = mon + 'px';
  }
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; force = true; }
  // tile in canvas units, then fit the window to it
  const X = TILE.x * A, W = TILE.w * A, Y = TILE.y, H = TILE.h;
  const At = W / H, Aw = w / h;
  let vx = 0, vy = 0, vw = w, vh = h, RX = X, RY = Y, RW = W, RH = H;
  if (isControl) { vw = mon; vh = h; }                 // each monitor is the whole canvas at exact aspect
  else if (fit === 'contain') {
    if (Aw > At) { vw = Math.max(1, Math.round(h * At)); vx = (w - vw) >> 1; }
    else         { vh = Math.max(1, Math.round(w / At)); vy = (h - vh) >> 1; }
  } else if (fit === 'cover') {
    if (Aw > At) { RH = W / Aw; RY = Y + (H - RH) / 2; }
    else         { RW = H * Aw; RX = X + (W - RW) / 2; }
  }                                                    // fill: whole window ← whole tile, stretched
  const viewChanged = vx !== view.x || vy !== view.y || vw !== view.w || vh !== view.h;
  view = { x: vx, y: vy, w: vw, h: vh }; region = { X: RX, Y: RY, W: RW, H: RH };
  const rw = Math.max(1, Math.floor(vw * config.renderScale));
  const rh = Math.max(1, Math.floor(vh * config.renderScale));
  force = force || viewChanged;
  if (force || rw !== renderW || rh !== renderH) {
    freeTarget(targetA); freeTarget(targetB);
    targetA = makeTarget(rw, rh); targetB = makeTarget(rw, rh);
    renderW = rw; renderH = rh;
  }
}
window.addEventListener('resize', () => resize(false));

// ---- rendering ------------------------------------------------------------
function drawScene(scene, target, t){
  const p = programs.get(scene.shader);
  const params = effParams(scene);
  const tu = tileUniforms(target);
  if (p.kind === 'module') {
    p.inst.draw({ target, time: t, params, seed: scene.seed, ...tu });
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE); gl.disable(gl.BLEND);
    gl.bindVertexArray(vao);
    return;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
  gl.viewport(0, 0, target.w, target.h);
  gl.bindVertexArray(vao);                 // never assume: a module scene may have unbound it
  gl.useProgram(p.prog);
  gl.uniform1f(p.u_time, t);
  gl.uniform2f(p.u_resolution, target.w, target.h);
  gl.uniform2f(p.u_fullResolution, tu.fullW, tu.fullH);
  gl.uniform2f(p.u_tileOrigin, tu.tileX, tu.tileY);
  gl.uniform1f(p.u_seed, scene.seed);
  for (const k in params) {
    let loc = p.params.get(k);
    if (loc === undefined) { loc = gl.getUniformLocation(p.prog, k); p.params.set(k, loc); }
    if (loc === null) continue;
    const v = params[k];
    if (typeof v === 'number') gl.uniform1f(loc, v);
    else if (Array.isArray(v)) {
      if (v.length === 2) gl.uniform2fv(loc, v);
      else if (v.length === 3) gl.uniform3fv(loc, v);
      else if (v.length === 4) gl.uniform4fv(loc, v);
    }
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let frames = 0, lastFpsT = now(), fps = 0, lastLog = now();
let showStats = qs.get('stats') === '1';
if (showStats) statsEl.style.display = 'block';
const bootT = now();

function composite(x, y, w, h, mixAmt){
  gl.viewport(x, y, w, h);
  gl.bindVertexArray(vao);
  gl.useProgram(compositeProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, targetA.tex); gl.uniform1i(compU.texA, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, targetB.tex); gl.uniform1i(compU.texB, 1);
  gl.uniform1f(compU.mixAmt, mixAmt);
  gl.uniform2f(compU.res, w, h);
  gl.uniform2f(compU.off, x, y);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function startFade(toIndex){ nxt = toIndex; fadeStart = showNow(); syncBroadcastState(); }
// Schedule advances on show time from a timer, not from rendered frames, so an occluded or
// throttled tab still keeps the show (and its followers) moving. Leader only; followers get it over the wire.
function tick(){
  if (!scenes.length) return;
  const t = showNow();
  if (nxt >= 0 && t - fadeStart >= config.crossfade) {
    cur = nxt; nxt = -1; sceneStart = fadeStart + config.crossfade; fadeStart = -1;
    if (isLeader()) syncBroadcastState();
    panelUpdate();
  }
  if (isLeader() && nxt < 0 && scenes.length > 1 && t - sceneStart >= scenes[cur].duration) {
    startFade((cur + 1) % scenes.length);
    // anchor to the ideal boundary so timer latency doesn't slip the timetable; after a long
    // stall (a frozen leader) start from now rather than firing a burst of catch-up fades
    const ideal = sceneStart + scenes[cur].duration;
    if (t - ideal < config.crossfade) fadeStart = ideal;
  }
}
setInterval(tick, 100);

function frame(){
  requestAnimationFrame(frame);
  if (!scenes.length) return;
  const t = showNow();
  const elapsed = t - sceneStart;
  const scene = scenes[cur];

  // program: what the displays show, crossfade included
  drawScene(scene, targetA, t - epoch);
  let mixAmt = 0;
  if (nxt >= 0) {
    drawScene(scenes[nxt], targetB, t - epoch);
    mixAmt = Math.min(1, Math.max(0, (t - fadeStart) / config.crossfade));
    mixAmt = mixAmt * mixAmt * (3 - 2 * mixAmt);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (isControl || view.w !== canvas.width || view.h !== canvas.height) {   // gap / letterbox bars
    gl.viewport(0, 0, canvas.width, canvas.height); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  if (isControl) {                                                       // PVW left, PGM right, switcher-style
    composite(view.w + MON_GAP, 0, view.w, view.h, mixAmt);               // PGM monitor
    const i = scenes.findIndex(s => s.name === panelSceneName());
    drawScene(i >= 0 ? scenes[i] : scene, targetA, t - epoch);            // preview: the scene being edited
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    composite(0, 0, view.w, view.h, 0);                                   // PVW monitor
  } else {
    composite(view.x, view.y, view.w, view.h, mixAmt);
  }

  // stats
  frames++;
  const ln = now();
  if (ln - lastFpsT >= 1) {
    fps = frames / (ln - lastFpsT); frames = 0; lastFpsT = ln;
    if (showStats) {
      const mem = performance.memory ? (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + ' MB heap' : '';
      statsEl.textContent =
        `fps ${fps.toFixed(1)}  ${canvas.width}x${canvas.height} -> ${renderW}x${renderH}  canvas ${config.canvas} ${fitMode()}  tile ${[TILE.x, TILE.y, TILE.w, TILE.h].map(v => +v.toFixed(3)).join(',')}\n` +
        `scene ${scene.name} ${elapsed.toFixed(0)}/${scene.duration}s` + (nxt >= 0 ? ` -> ${scenes[nxt].name} ${(mixAmt*100).toFixed(0)}%` : '') + `\n` +
        `uptime ${((ln - bootT)/60).toFixed(1)} min  ${mem}\n` + syncStatsLine();
    }
  }
  if (ln - lastLog >= 60) {
    lastLog = ln;
    const mem = performance.memory ? (performance.memory.usedJSHeapSize / 1048576).toFixed(1) : '?';
    console.log(`[stats] uptime=${((ln - bootT)/60).toFixed(0)}min fps=${fps.toFixed(1)} scene=${scene.name} heapMB=${mem} ${syncStatsLine()}`);
  }
}

// ---- input ----------------------------------------------------------------
window.addEventListener('keydown', e => {
  if (e.key === 's') { showStats = !showStats; statsEl.style.display = showStats ? 'block' : 'none'; }
  if (e.key === 'n') requestSkip();
  if (e.key === 'f') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});
function jumpTo(name){
  const i = scenes.findIndex(s => s.name === name);
  if (i < 0 || i === cur || nxt >= 0) return;
  if (isLeader()) startFade(i);
  else if (leaderId) syncSend(leaderId, { type:'jump', scene: name });
}
function requestSkip(){
  if (scenes.length < 2 || nxt >= 0) return;
  if (isLeader()) startFade((cur + 1) % scenes.length);
  else if (leaderId) syncSend(leaderId, { type:'skip' });
}

// ===========================================================================
// sync: PeerJS. One PeerServer (local or public). The room is a well-known peer id
// that the first display claims; everyone else connects to it (a star). The leader
// owns the schedule and the show clock; followers NTP-ping it and slew their clock.
// ===========================================================================
let room = qs.get('sync');                 // or scenes.json sync.room, resolved in syncStart()
let syncKey = qs.get('key') || null;       // or scenes.json sync.key: shared secret checked in hello
const myTag = qs.get('id') || Math.random().toString(36).slice(2, 8);   // human-readable name for status
const UA = (navigator.userAgent.match(/(Chrome|Chromium|Firefox|Safari|Edg)\/[\d.]+/) || [''])[0] + ' ' + navigator.platform;
let myId = myTag;                          // PeerJS id once registered; equals leaderId while self-leading
let leaderId = myId;                       // everyone leads itself until connected, so PGM works standalone
let peer = null;                           // PeerJS Peer
let leaderConn = null;                     // follower side: DataConnection to the leader
const followers = new Map();               // leader side: id -> { conn, role, ua, tag }
let statePeers = [];                       // follower side: the leader's peer list, from state
let serverKind = null;                     // 'local' | 'public' | 'custom'
let autoServer = false;                    // true when serverKind came from "auto" (allows local→public fallback)
let reconnectTimer = null, rejected = false;
let pingSamples = [];                      // { rtt, offset } to leader, newest last
let lastPong = 0;                          // follower: last time the leader answered; silence > 5 s = leader gone
let targetOffset = null, syncRtt = 0;

function isLeader(){ return leaderId === myId; }
function roomPeerId(){
  const safe = String(room).replace(/[^A-Za-z0-9_-]/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  return 'vjshow-' + (safe || 'show');
}
function peerList(){                        // [{id, tag, role, ua}], self included, for the status line
  if (isLeader()) return [{ id: myId, tag: myTag, role: MODE, ua: UA }, ...[...followers].map(([id, f]) => ({ id, tag: f.tag, role: f.role, ua: f.ua }))];
  return statePeers;
}
function tileTags(){ return peerList().filter(p => p.role !== 'control').map(p => p.tag || p.id); }
function connectedIds(){ return isLeader() ? [...followers.keys()] : (leaderConn ? [leaderId] : []); }
function syncStatsLine(){
  if (!room) return '';
  return `sync room=${room} ${serverKind || '-'} id=${myTag}${isControl ? ' CONTROL' : ''} ${isLeader() ? 'LEADER' : 'follower'} tiles=${tileTags().join(',') || '-'}` +
         (isLeader() ? '' : ` offset=${(clockOffset*1000).toFixed(1)}ms rtt=${(syncRtt*1000).toFixed(1)}ms`);
}

// ---- which PeerServer ------------------------------------------------------
function resolveServerKind(){
  const pref = qs.get('peerserver') || (config.sync && config.sync.peerserver) || 'auto';
  autoServer = pref === 'auto';
  if (typeof pref === 'object') return pref;
  if (pref === 'auto') return (/\.github\.io$/.test(location.hostname) || location.protocol === 'file:') ? 'public' : 'local';
  return pref;
}
function peerOptions(kind){
  const ice = (config.sync && config.sync.ice) || null;
  if (kind === 'public') return { debug: 0, config: { iceServers: ice || [{ urls: 'stun:stun.l.google.com:19302' }] } };
  if (kind === 'local') return { debug: 0, host: location.hostname, port: +location.port || (location.protocol === 'https:' ? 443 : 80),
                                 path: '/peerjs', secure: location.protocol === 'https:', config: { iceServers: ice || [] } };
  return Object.assign({ debug: 0 }, kind);          // custom object: { host, port, path, secure, key }
}
const SERVER_ERRORS = ['network', 'server-error', 'socket-error', 'socket-closed', 'ssl-unavailable', 'invalid-key'];
function newPeer(id){
  const p = new Peer(id, peerOptions(serverKind));
  if (autoServer && serverKind === 'local') {         // no local PeerServer (plain static host): use the public one
    const t = setTimeout(fail, 5000);
    p.on('open', () => clearTimeout(t));
    p.on('error', e => { if (SERVER_ERRORS.includes(e.type)) fail(); });
    function fail(){
      if (serverKind !== 'local' || peer !== p) return;
      clearTimeout(t); console.warn('[sync] no local PeerServer at', location.host, '- using the public one');
      serverKind = 'public'; connect();
    }
  }
  return p;
}

// ---- connect / claim / follow ---------------------------------------------
function teardown(){
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (peer) { const p = peer; peer = null; try { p.destroy(); } catch(e){} }
  leaderConn = null; followers.clear();
}
function connect(){
  teardown();
  if (rejected || !room) return;
  if (isControl) follow(); else claim();
}
function scheduleReconnect(why){
  if (rejected || reconnectTimer) return;
  const delay = isControl ? 3000 : 500 + Math.random() * 1500;
  console.log('[sync] reconnect in', Math.round(delay), 'ms:', why);
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, delay);
}
// A display tries to be the room: register the room id. First one wins and leads.
function claim(){
  const id = roomPeerId();
  const p = peer = newPeer(id);
  p.on('open', () => {
    if (peer !== p) return;
    myId = id; leaderId = id; leaderConn = null; pingSamples = []; targetOffset = null;
    console.log('[sync] leading room', room, 'via', serverKind, 'PeerServer');
    p.on('connection', onFollower);
    panelStatus(); syncBroadcastState();
  });
  p.on('error', e => {
    if (peer !== p) return;
    if (e.type === 'unavailable-id') { console.log('[sync] room', room, 'already has a leader; following'); follow(); }
    else if (!SERVER_ERRORS.includes(e.type)) console.warn('[sync] peer error', e.type, e.message);
  });
  p.on('disconnected', () => { if (peer === p) scheduleReconnect('lost the PeerServer'); });
}
// Everyone else: register anonymously and open one channel to the room id.
function follow(){
  if (peer) { const old = peer; peer = null; try { old.destroy(); } catch(e){} }
  followers.clear(); leaderConn = null;
  const p = peer = newPeer(undefined);
  p.on('open', id => {
    if (peer !== p) return;
    myId = id;
    const conn = p.connect(roomPeerId(), { reliable: true, serialization: 'json', metadata: { role: MODE, tag: myTag } });
    let opened = false;
    conn.on('open', () => {
      if (peer !== p) return;
      opened = true; leaderConn = conn; leaderId = roomPeerId(); pingSamples = []; targetOffset = null; lastPong = now();
      conn.send({ type: 'hello', role: MODE, tag: myTag, ua: UA, key: syncKey });
      console.log('[sync] following room', room, 'via', serverKind, 'PeerServer');
      panelStatus();
    });
    conn.on('data', m => handleData(leaderId, m));
    conn.on('close', () => { if (leaderConn === conn) { leaderConn = null; if (!isLeader()) statePeers = []; } if (peer === p) scheduleReconnect('leader gone'); });
    conn.on('error', e => console.warn('[sync] channel error', e.type || '', e.message || e));
    setTimeout(() => { if (!opened && peer === p) scheduleReconnect('connect timed out'); }, 8000);
  });
  p.on('error', e => {
    if (peer !== p) return;
    if (e.type === 'peer-unavailable') scheduleReconnect(isControl ? 'no display in the room yet' : 'leader vanished');
    else if (!SERVER_ERRORS.includes(e.type)) console.warn('[sync] peer error', e.type, e.message);
  });
  p.on('disconnected', () => { if (peer === p) scheduleReconnect('lost the PeerServer'); });
}
// Leader side: a follower connected. First message must be hello with the right key.
function onFollower(conn){
  let hello = false;
  conn.on('data', m => {
    if (!hello) {
      if (!m || m.type !== 'hello') { conn.close(); return; }
      if ((syncKey || m.key) && m.key !== syncKey) {
        console.warn('[sync] rejected', m.tag || conn.peer, ': wrong key');
        try { conn.send({ type: 'rejected', reason: 'wrong key' }); } catch(e){}
        setTimeout(() => conn.close(), 200); return;
      }
      hello = true;
      followers.set(conn.peer, { conn, role: m.role === 'control' ? 'control' : 'display', ua: m.ua || '', tag: m.tag || conn.peer });
      console.log('[sync] follower', m.tag, m.role, m.ua);
      panelStatus(); syncBroadcastState();
      return;
    }
    handleData(conn.peer, m);
  });
  conn.on('close', () => { followers.delete(conn.peer); panelStatus(); syncBroadcastState(); });
  conn.on('error', () => { followers.delete(conn.peer); });
}

// ---- messages --------------------------------------------------------------
function syncSend(id, msg){
  try {
    if (isLeader()) { const f = followers.get(id); if (f) f.conn.send(msg); }
    else if (leaderConn) leaderConn.send(msg);
  } catch(e){ console.warn('[sync] send failed', e.message); }
}
function syncBroadcast(msg){ for (const [id] of followers) syncSend(id, msg); }
function stateMsg(){
  return { type:'state', epoch, cur: scenes[cur] && scenes[cur].name, nxt: nxt >= 0 ? scenes[nxt].name : null,
           sceneStart, fadeStart, overrides, peers: peerList().map(p => ({ id: p.id, tag: p.tag, role: p.role, ua: p.ua })) };
}
function syncBroadcastState(){ if (room && isLeader() && scenes.length && followers.size) syncBroadcast(stateMsg()); }

function handleData(from, m){
  if (!m || typeof m !== 'object') return;
  if (m.type === 'ping') {
    const f = followers.get(from); if (f) f.lastPing = now();
    syncSend(from, { type:'pong', t0: m.t0, t1: showNow() });
  } else if (m.type === 'pong') {
    const t2 = now(); lastPong = t2;
    const rtt = t2 - m.t0;
    const offset = m.t1 - (m.t0 + t2) / 2;   // local + offset ≈ leader show clock
    pingSamples.push({ rtt, offset });
    if (pingSamples.length > 16) pingSamples.shift();
    const best = pingSamples.reduce((a, b) => (b.rtt < a.rtt ? b : a));
    targetOffset = best.offset; syncRtt = best.rtt;
  } else if (m.type === 'state') {
    if (isLeader()) return;
    statePeers = m.peers || [];
    const ci = scenes.findIndex(s => s.name === m.cur);
    if (ci < 0) { panelStatus(); return; }        // config not caught up yet; next state msg will do
    const ni = m.nxt ? scenes.findIndex(s => s.name === m.nxt) : -1;
    epoch = m.epoch; cur = ci; nxt = ni; sceneStart = m.sceneStart; fadeStart = ni >= 0 ? m.fadeStart : -1;
    overrides = m.overrides || {};
    panelUpdate();
  } else if (m.type === 'rejected') {
    rejected = true; showErr('sync: this room rejected us (' + m.reason + '). Check sync.key / ?key=');
    teardown(); panelStatus();
  } else if (m.type === 'skip') {
    if (isLeader()) requestSkip();
  } else if (m.type === 'setParam') {
    if (isLeader()) applyOverride(m.scene, m.key, m.value, true);
  } else if (m.type === 'resetScene') {
    if (isLeader()) { delete overrides[m.scene]; syncBroadcastState(); }
  } else if (m.type === 'jump') {
    if (isLeader()) jumpTo(m.scene);
  }
}

let stateTimer = null;
function applyOverride(sceneName, key, value, broadcast){
  (overrides[sceneName] = overrides[sceneName] || {})[key] = value;
  if (broadcast && isLeader() && !stateTimer) {           // coalesce slider drags to ~30 Hz
    stateTimer = setTimeout(() => { stateTimer = null; syncBroadcastState(); }, 33);
  }
}
// Controller-side entry point: local echo for the preview, then hand it to the leader.
function setParam(sceneName, key, value){
  applyOverride(sceneName, key, value, true);
  if (!isLeader()) syncSend(leaderId, { type:'setParam', scene: sceneName, key, value });
}

// Runs on a timer, not per frame: a hidden/throttled tab must still converge.
let lastSlew = now();
function syncSlewClock(){
  const t = now(), dt = Math.min(1, t - lastSlew); lastSlew = t;
  if (targetOffset === null || isLeader()) return;
  const d = targetOffset - clockOffset;
  if (pingSamples.length < 4) { clockOffset = targetOffset; return; }        // settling: take the best sample outright
  if (Math.abs(d) > 0.25) { clockOffset = targetOffset; console.log('[sync] clock jump', (d*1000).toFixed(0), 'ms'); }
  else { const max = 0.03 * dt; clockOffset += Math.max(-max, Math.min(max, d)); }   // ≤30 ms per second
}

function syncStart(){
  if (!room && config.sync && config.sync.room) room = String(config.sync.room);
  if (!syncKey && config.sync && config.sync.key) syncKey = String(config.sync.key);
  panelStatus();
  if (!room) return;
  if (typeof Peer === 'undefined' || !window.RTCPeerConnection) { showErr('PeerJS/WebRTC not available; running unsynced'); return; }
  serverKind = resolveServerKind();
  console.log('[sync] room', room, 'as', myTag, MODE, 'via', serverKind, 'PeerServer; tile', TILE);
  connect();
  setInterval(() => {
    if (isLeader() || !leaderConn) return;
    if (now() - lastPong > 5) { console.warn('[sync] leader silent for 5 s; assuming it is gone'); const c = leaderConn; leaderConn = null; try { c.close(); } catch(e){} scheduleReconnect('leader silent'); return; }
    syncSend(leaderId, { type:'ping', t0: now() });
  }, 500);
  // leader: drop followers that stopped pinging (a closed tab is not always detected by ICE quickly)
  setInterval(() => {
    if (!isLeader()) return;
    for (const [id, f] of followers) if (f.lastPing && now() - f.lastPing > 10) { console.warn('[sync] follower', f.tag, 'silent; dropping'); try { f.conn.close(); } catch(e){} followers.delete(id); panelStatus(); syncBroadcastState(); }
  }, 2000);
  setInterval(syncSlewClock, 50);
  setInterval(() => syncBroadcastState(), 1000);
}

// ===========================================================================
// control panel (?mode=control): sliders for the current scene's params
// ===========================================================================
const panel = { scene: null, building: false };
const $ = id => document.getElementById(id);
function panelStatus(){
  if (!isControl) return;
  const el = $('pstatus');
  const editing = panelSceneName(), playing = cur >= 0 && scenes[cur] ? scenes[cur].name : null;
  const note = editing && editing !== playing ? `\npreviewing "${editing}"; displays are playing "${playing}" (press play now to switch)` : '';
  $('pplay').disabled = !editing || editing === playing;
  const via = serverKind ? ` via ${serverKind} PeerServer` : '';
  if (rejected) { el.style.color = '#f66'; el.textContent = `REJECTED by room "${room}": wrong key. Set sync.key in scenes.json or ?key= on this URL.` + note; return; }
  if (!room) { el.style.color = '#f96'; el.textContent = 'NO ROOM: running standalone, nothing else is controlled.\nAdd ?sync=<room> to this URL, or "sync": {"room": "show"} to scenes.json.' + note; return; }
  if (isLeader()) { el.style.color = '#f96'; el.textContent = `NO DISPLAY in room "${room}"${via}: running standalone, nothing else is controlled.\nOpen a display in the same room; this page will attach to it.` + note; return; }
  el.style.color = '#8c8';
  el.textContent = `room "${room}"${via}: tiles ${tileTags().join(', ') || '-'}` + note;
}
function panelSceneName(){
  if ($('plock').checked && panel.scene && scenes.some(s => s.name === panel.scene)) return panel.scene;
  return cur >= 0 && scenes[cur] ? scenes[cur].name : null;
}
// ?range=N on the control URL: sliders run 0..N×value (−N×|v|..N×|v| for negatives). Default 2.
const RANGE = Math.max(1.01, +qs.get('range') || 2);
function sliderSpec(scene, key, v){
  const c = (config.scenes.find(s => (s.name || s.module || s.shader) === scene.name) || {}).controls || {};
  const spec = c[key] || {};
  const a = Math.abs(v) || 1;
  const min = spec.min !== undefined ? spec.min : (v < 0 ? -RANGE * a : 0);
  const max = spec.max !== undefined ? spec.max : RANGE * a;
  const step = spec.step !== undefined ? spec.step : (max - min) / 200;
  return { min, max, step };
}
function panelRebuild(){
  if (!isControl) return;
  const sel = $('pscene');
  const want = panelSceneName();
  sel.innerHTML = '';
  for (const sc of scenes) { const o = document.createElement('option'); o.value = o.textContent = sc.name; sel.appendChild(o); }
  if (want) sel.value = want;
  panel.scene = want;
  const box = $('psliders'); box.innerHTML = '';
  const scene = scenes.find(s => s.name === want);
  if (!scene) return;
  const params = effParams(scene);
  const numeric = Object.keys(params).filter(k => typeof params[k] === 'number' || Array.isArray(params[k]));
  if (!numeric.length) { box.innerHTML = '<div class="status">no numeric params in this scene</div>'; }
  for (const key of numeric) {
    const v = params[key];
    const comps = Array.isArray(v) ? v.length : 1;
    for (let i = 0; i < comps; i++) {
      const val = Array.isArray(v) ? v[i] : v;
      const { min, max, step } = sliderSpec(scene, key, Array.isArray(scene.params[key]) ? scene.params[key][i] : scene.params[key]);
      const row = document.createElement('div'); row.className = 'row';
      const label = document.createElement('label'); label.textContent = comps > 1 ? `${key}[${i}]` : key;
      const input = document.createElement('input'); input.type = 'range';
      input.min = min; input.max = max; input.step = step; input.value = val;
      input.dataset.key = key; input.dataset.comp = i;
      const out = document.createElement('span'); out.className = 'val'; out.textContent = fmt(val);
      input.addEventListener('input', () => {
        const n = +input.value; out.textContent = fmt(n); input.dataset.touched = performance.now();
        const curVal = effParams(scene)[key];
        const next = Array.isArray(curVal) ? curVal.map((c, j) => (j === i ? n : c)) : n;
        setParam(scene.name, key, next);
      });
      row.append(label, input, out); box.appendChild(row);
    }
  }
  panelStatus();
}
function fmt(n){ return Math.abs(n) >= 100 ? n.toFixed(0) : Math.abs(n) >= 10 ? n.toFixed(1) : n.toFixed(3); }
// Incoming state: move sliders the user is not touching, switch scene if not locked.
function panelUpdate(){
  if (!isControl) return;
  const want = panelSceneName();
  if (want !== panel.scene) { panelRebuild(); return; }
  const scene = scenes.find(s => s.name === want);
  if (!scene) return;
  const params = effParams(scene);
  for (const input of $('psliders').querySelectorAll('input[type=range]')) {
    if (input === document.activeElement || performance.now() - (+input.dataset.touched || 0) < 400) continue;
    const v = params[input.dataset.key]; if (v === undefined) continue;
    const n = Array.isArray(v) ? v[+input.dataset.comp] : v;
    if (+input.value !== n) { input.value = n; input.nextElementSibling.textContent = fmt(n); }
  }
  panelStatus();
}
// press feedback: every panel button flashes on click; `done` shows a short confirmation label
function flash(btn, doneText){
  btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 180);
  if (doneText) { const t = btn.textContent; btn.textContent = doneText; btn.classList.add('done');
                  setTimeout(() => { btn.textContent = t; btn.classList.remove('done'); }, 1200); }
}
if (isControl) {
  for (const b of document.querySelectorAll('#panel button')) b.addEventListener('click', () => flash(b));
  fetch('scenes', { cache:'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null).then(c => {
    if (!c || !c.save) { $('psave').disabled = true; $('psave').title = 'no server to save to (static host); tweaks live in the leader until it restarts'; }
  });
  $('pscene').addEventListener('change', e => { panel.scene = e.target.value; $('plock').checked = true; panelRebuild(); });
  $('plock').addEventListener('change', () => { if (!$('plock').checked) panelRebuild(); });
  $('pnext').addEventListener('click', requestSkip);
  $('pplay').addEventListener('click', () => { const n = panelSceneName(); if (n) { jumpTo(n); flash($('pplay'), 'fading…'); } });
  $('preset').addEventListener('click', () => {
    const name = panelSceneName(); if (!name) return;
    delete overrides[name];
    if (isLeader()) syncBroadcastState(); else if (leaderId) syncSend(leaderId, { type:'resetScene', scene: name });
    panelRebuild();
  });
  $('psave').addEventListener('click', async () => {
    // merge live overrides into the loaded scenes.json and write it back; displays hot-reload it
    const cfg = JSON.parse(configText);
    for (const s of cfg.scenes) {
      const name = s.name || s.module || s.shader;
      if (overrides[name]) s.params = Object.assign({}, s.params || {}, overrides[name]);
    }
    try {
      const r = await fetch('scenes', { method:'POST', body: JSON.stringify(cfg, null, 2) });
      if (!r.ok) throw new Error(await r.text());
      flash($('psave'), 'saved ✓');
    } catch (e) { showErr('save failed: ' + e.message); }
  });
}

// ---- boot -----------------------------------------------------------------
(async () => {
  try { await loadConfig(); }
  catch (e) { showErr('config: ' + e.message); }
  sceneStart = showNow();
  requestAnimationFrame(frame);
  setInterval(async () => {
    try { await loadConfig(); }
    catch (e) { showErr('reload: ' + e.message); }   // keep playing old config
  }, Math.max(1, config.reloadInterval) * 1000);
  syncStart();
})();
</script>
</body>
</html>
